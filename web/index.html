<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YT Thumb Android</title>
  <style>
    :root {
      --bg: #eef3f8;
      --panel: #ffffff;
      --text: #162033;
      --muted: #6b778c;
      --line: #d8e0ea;
      --accent: #da4b2e;
      --accent-2: #ffb36b;
      --ok: #1f8f5f;
      --error: #c63b3b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(255, 179, 107, 0.35), transparent 28%),
        linear-gradient(180deg, #f8fafc 0%, var(--bg) 100%);
      color: var(--text);
      font-family: "Segoe UI", "Microsoft YaHei UI", sans-serif;
    }

    .page {
      width: min(760px, 100%);
      margin: 0 auto;
      padding: 20px 16px 28px;
    }

    .hero {
      background: linear-gradient(135deg, #1f2533 0%, #33415f 100%);
      color: #fff;
      border-radius: 22px;
      padding: 22px 18px;
      box-shadow: 0 16px 40px rgba(31, 37, 51, 0.18);
    }

    .hero h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.1;
    }

    .hero p {
      margin: 10px 0 0;
      color: rgba(255, 255, 255, 0.82);
      line-height: 1.5;
    }

    .card {
      margin-top: 16px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 16px;
      box-shadow: 0 10px 28px rgba(32, 45, 72, 0.08);
    }

    .label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 700;
    }

    input,
    select,
    button,
    textarea {
      font: inherit;
    }

    input,
    select {
      width: 100%;
      border: 1px solid var(--line);
      background: #fbfcfe;
      color: var(--text);
      border-radius: 14px;
      padding: 14px 14px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(218, 75, 46, 0.12);
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 160px;
      gap: 12px;
      margin-top: 14px;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 14px 16px;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
      box-shadow: 0 10px 22px rgba(218, 75, 46, 0.28);
    }

    button:disabled {
      opacity: 0.65;
      box-shadow: none;
    }

    .status-line {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
      font-weight: 600;
      flex-wrap: wrap;
    }

    .status-line small {
      color: var(--muted);
      font-weight: 500;
    }

    .progress-shell {
      overflow: hidden;
      height: 14px;
      border-radius: 999px;
      background: #edf2f7;
      border: 1px solid var(--line);
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent) 0%, var(--accent-2) 100%);
      transition: width 0.25s ease;
    }

    .meta {
      margin-top: 10px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
      word-break: break-word;
    }

    .result,
    .error {
      margin-top: 12px;
      border-radius: 14px;
      padding: 12px 14px;
      line-height: 1.5;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .result {
      background: rgba(31, 143, 95, 0.08);
      color: var(--ok);
    }

    .error {
      background: rgba(198, 59, 59, 0.08);
      color: var(--error);
    }

    textarea {
      width: 100%;
      min-height: 260px;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px;
      resize: none;
      background: #fcfdff;
      color: #21304a;
    }

    @media (max-width: 560px) {
      .hero h1 {
        font-size: 24px;
      }

      .row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <section class="hero">
      <h1>YT Thumb Android</h1>
      <p>下载 YouTube 视频、封面或音频。当前安卓版本会保存到应用私有目录，避免系统权限弹窗导致闪退。</p>
    </section>

    <section class="card">
      <label class="label" for="url">YouTube 链接</label>
      <input id="url" type="url" placeholder="https://www.youtube.com/watch?v=...">
      <div class="row">
        <select id="mode">
          <option value="full">视频 + 封面</option>
          <option value="thumbnail">仅封面</option>
          <option value="audio">仅音频</option>
        </select>
        <button id="start">开始下载</button>
      </div>
    </section>

    <section class="card">
      <div class="status-line">
        <span id="status">就绪</span>
        <small id="percent">0%</small>
      </div>
      <div class="progress-shell">
        <div class="progress-bar" id="progress"></div>
      </div>
      <div class="meta" id="output">输出目录: -</div>
      <div class="result" id="result" hidden></div>
      <div class="error" id="error" hidden></div>
    </section>

    <section class="card">
      <label class="label" for="logs">日志</label>
      <textarea id="logs" readonly></textarea>
    </section>
  </div>

  <script>
    const urlEl = document.getElementById("url");
    const modeEl = document.getElementById("mode");
    const startEl = document.getElementById("start");
    const statusEl = document.getElementById("status");
    const percentEl = document.getElementById("percent");
    const progressEl = document.getElementById("progress");
    const outputEl = document.getElementById("output");
    const logsEl = document.getElementById("logs");
    const resultEl = document.getElementById("result");
    const errorEl = document.getElementById("error");

    async function refresh() {
      const res = await fetch("/api/status", { cache: "no-store" });
      const data = await res.json();

      statusEl.textContent = data.status || "就绪";
      percentEl.textContent = `${Math.round(data.progress || 0)}%`;
      progressEl.style.width = `${Math.max(0, Math.min(100, data.progress || 0))}%`;
      outputEl.textContent = `输出目录: ${data.output_dir || "-"}`;
      logsEl.value = (data.logs || []).join("\n");
      logsEl.scrollTop = logsEl.scrollHeight;
      startEl.disabled = !!data.running;

      const resultLines = [];
      if (data.result) {
        for (const [key, value] of Object.entries(data.result)) {
          resultLines.push(`${key}: ${value}`);
        }
      }
      resultEl.hidden = resultLines.length === 0;
      resultEl.textContent = resultLines.join("\n");

      errorEl.hidden = !data.error;
      errorEl.textContent = data.error || "";
    }

    async function startTask() {
      const payload = {
        url: urlEl.value.trim(),
        mode: modeEl.value,
      };

      errorEl.hidden = true;
      errorEl.textContent = "";

      const res = await fetch("/api/start", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      const data = await res.json();
      if (!res.ok || !data.ok) {
        errorEl.hidden = false;
        errorEl.textContent = data.error || "启动失败";
      }
      await refresh();
    }

    startEl.addEventListener("click", () => {
      startTask().catch((err) => {
        errorEl.hidden = false;
        errorEl.textContent = String(err);
      });
    });

    refresh().catch(() => {});
    setInterval(() => {
      refresh().catch(() => {});
    }, 1000);
  </script>
</body>
</html>
